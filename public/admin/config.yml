backend:
  name: git-gateway
  repo: Darwin-Danish/darwindanish
  branch: main

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Main Posts"
    folder: "src/content/blog"
    filter: { field: "parent_slug", value: "" }
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "blog/posts/{{slug}}"
    fields:
      - { name: "parent_slug", label: "Parent Slug", widget: "hidden", default: "" }
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "draft", label: "Draft", widget: "boolean", required: false, default: false }
      - { name: "tags", label: "Tags", widget: "list", required: false, allow_add: true, hint: "Auto-colored tags: travel, f1, ai, iot, game, python, etc." }
      - { name: "authors", label: "Authors (ids)", widget: "list", required: false, allow_add: true, hint: "Use 'darwindanish'" }
      - { name: "image", label: "Image", widget: "image", required: false }
      - { name: "body", label: "Body", widget: "markdown", hint: "## (H2) and ### (H3) create SECTIONS in the sidebar. Use the + to add Callouts/Math/Challenges." }

  - name: "subposts"
    label: "Subposts (Series)"
    folder: "src/content/blog"
    filter: { field: "parent_slug", pattern: ".+" }
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    path: "{{parent_slug}}/{{slug}}"
    fields:
      - name: "parent_slug"
        label: "Parent Post"
        widget: "relation"
        collection: "blog"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        hint: "Select the Main Post that this belongs to."
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "order", label: "Order in Series", widget: "number", default: 1, value_type: "int", min: 1 }
      - { name: "draft", label: "Draft", widget: "boolean", required: false, default: false }
      - { name: "tags", label: "Tags", widget: "list", required: false, allow_add: true }
      - { name: "authors", label: "Authors (ids)", widget: "list", required: false, allow_add: true }
      - { name: "image", label: "Image", widget: "image", required: false }
      - { name: "body", label: "Body", widget: "markdown", hint: "## (H2) and ### (H3) create SECTIONS in the sidebar." }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "tags", label: "Tags", widget: "list", allow_add: true }
      - { name: "image", label: "Image", widget: "image" }
      - { name: "link", label: "Link", widget: "string" }
      - { name: "startDate", label: "Start date", widget: "datetime", required: false }
      - { name: "endDate", label: "End date", widget: "datetime", required: false }
      - { name: "order", label: "Order", widget: "number", required: false, value_type: "int", min: 0 }
      - { name: "body", label: "Notes (optional)", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About page"
        file: "src/content/about.mdx"
        fields:
          - { name: "body", label: "Body", widget: "markdown" }
      - name: "work"
        label: "Work intro"
        file: "src/content/work.mdx"
        fields:
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "authors"
    label: "Authors"
    folder: "src/content/authors"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "pronouns", label: "Pronouns", widget: "string", required: false }
      - { name: "avatar", label: "Avatar", widget: "string", hint: "Gravatar URL (https://gravatar.com/avatar/...) or relative path (/uploads/avatar.png). Tip: get your Gravatar URL from gravatar.com" }
      - { name: "bio", label: "Bio", widget: "text", required: false }
      - { name: "mail", label: "Email", widget: "string", required: false }
      - { name: "website", label: "Website", widget: "string", required: false }
      - { name: "twitter", label: "Twitter", widget: "string", required: false }
      - { name: "github", label: "GitHub", widget: "string", required: false }
      - { name: "linkedin", label: "LinkedIn", widget: "string", required: false }
      - { name: "discord", label: "Discord", widget: "string", required: false }

  - name: "tags"
    label: "Tag Colors & Icons"
    folder: "src/content/tags"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { name: "name", label: "Tag Name", widget: "string", hint: "Exactly matches the tag text (e.g. 'F1')" }
      - { name: "color", label: "Tailwind Colors", widget: "string", hint: "e.g. 'bg-red-50 text-red-700 dark:bg-red-950/30 dark:text-red-200'" }
      - { name: "icon", label: "Icon Name", widget: "string", hint: "e.g. 'lucide:flag' (Find icons at icon-sets.iconify.design)" }

