backend:
  name: git-gateway
  repo: Darwin-Danish/darwindanish
  branch: main

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "blog/posts/{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "draft", label: "Draft", widget: "boolean", required: false, default: false }
      - { name: "order", label: "Order (subposts only)", widget: "number", required: false, value_type: "int", min: 0 }
      - { name: "tags", label: "Tags", widget: "list", required: false, allow_add: true, hint: "Auto-colored tags: crypto, web, reverse, pwn, forensic, osint, travel, tutorial, review, testing, music, movie, f1, ai, iot, game, python, security, photography, docker, database, linux" }
      - { name: "authors", label: "Authors (ids)", widget: "list", required: false, allow_add: true, hint: "Use the author file slug (e.g. 'darwindanish'). Matches src/content/authors/<id>.md" }
      - { name: "image", label: "Image", widget: "image", required: false }
      - { name: "body", label: "Body", widget: "markdown", hint: "Use the + toolbar to insert Callout, Challenge, CountryFlag, FirstSubpost, StaticTweet, and Math blocks. For MDX components, add the import at the top of the body (use MDX Import widget)." }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "tags", label: "Tags", widget: "list", allow_add: true }
      - { name: "image", label: "Image", widget: "image" }
      - { name: "link", label: "Link", widget: "string" }
      - { name: "startDate", label: "Start date", widget: "datetime", required: false }
      - { name: "endDate", label: "End date", widget: "datetime", required: false }
      - { name: "order", label: "Order", widget: "number", required: false, value_type: "int", min: 0 }
      - { name: "body", label: "Notes (optional)", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About page"
        file: "src/content/about.mdx"
        fields:
          - { name: "body", label: "Body", widget: "markdown" }
      - name: "work"
        label: "Work intro"
        file: "src/content/work.mdx"
        fields:
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "authors"
    label: "Authors"
    folder: "src/content/authors"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "pronouns", label: "Pronouns", widget: "string", required: false }
      - { name: "avatar", label: "Avatar", widget: "string", hint: "Gravatar URL (https://gravatar.com/avatar/...) or relative path (/uploads/avatar.png). Tip: get your Gravatar URL from gravatar.com" }
      - { name: "bio", label: "Bio", widget: "text", required: false }
      - { name: "mail", label: "Email", widget: "string", required: false }
      - { name: "website", label: "Website", widget: "string", required: false }
      - { name: "twitter", label: "Twitter", widget: "string", required: false }
      - { name: "github", label: "GitHub", widget: "string", required: false }
      - { name: "linkedin", label: "LinkedIn", widget: "string", required: false }
      - { name: "discord", label: "Discord", widget: "string", required: false }

